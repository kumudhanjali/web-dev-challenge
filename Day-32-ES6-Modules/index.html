<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Day 32 - ES6 Modules</title>

    <link rel="stylesheet" href="style.css">
</head>

<body>

    <!-- ============================= -->
    <!-- HEADER -->
    <!-- ============================= -->

    <header class="header">

        <p class="day-label">DAY 32 / 50</p>

        <h1>ES6 Modules</h1>

        <p class="subtitle">
            A modular Infinite Scroll application using
            import, export and separation of concerns.
        </p>

    </header>


    <!-- ============================= -->
    <!-- MAIN CONTENT -->
    <!-- ============================= -->

    <main class="container">

        <section class="feed-section">

            <!-- Posts will be inserted here -->
            <div id="data-feed"></div>


            <!-- Sentinel watched by IntersectionObserver -->
            <div id="scroll-sentinel" class="loading-spinner">

                <span class="spinner"></span>

                <span>Loading more...</span>

            </div>

        </section>

    </main>


    <!-- ============================= -->
    <!-- JAVASCRIPT MODULE -->
    <!-- ============================= -->

    <script type="module" src="main.js"></script>

</body>

</html>
