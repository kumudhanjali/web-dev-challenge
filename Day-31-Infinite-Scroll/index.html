<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Day 31 - Infinite Scroll</title>

    <link rel="stylesheet" href="style.css">
</head>

<body>

    <!-- ============================= -->
    <!-- HEADER -->
    <!-- ============================= -->

    <header class="header">

        <p class="day-label">DAY 31 / 50</p>

        <h1>Infinite Scroll</h1>

        <p class="subtitle">
            Loading API data dynamically using pagination
            and IntersectionObserver
        </p>

    </header>


    <!-- ============================= -->
    <!-- MAIN CONTENT -->
    <!-- ============================= -->

    <main class="container">

        <section class="feed-section">

            <!-- Posts will be inserted here -->
            <div id="data-feed"></div>


            <!-- Sentinel watched by IntersectionObserver -->
            <div id="scroll-sentinel" class="loading-spinner">

                <span class="spinner"></span>

                <span>Loading more...</span>

            </div>

        </section>

    </main>


    <!-- ============================= -->
    <!-- JAVASCRIPT -->
    <!-- ============================= -->

    <script src="script.js"></script>

</body>
</html>
