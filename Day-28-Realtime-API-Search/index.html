<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        http-equiv="X-UA-Compatible"
        content="IE=edge">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0">

    <title>
        Synexus | Real-Time GitHub Search
    </title>

    <link
        rel="stylesheet"
        href="style.css">

</head>


<body>


    <main>


        <!-- ========================================== -->
        <!-- DAY 28: REAL-TIME SEARCH                   -->
        <!-- ========================================== -->

        <section class="github-section">

            <h1>
                GitHub Real-Time Search
            </h1>

            <p>
                Start typing a GitHub username
                to search instantly.
            </p>


            <div class="search-container">

                <input
                    type="text"
                    id="github-username"
                    placeholder="Start typing a GitHub username..."
                    aria-label="GitHub username"
                    autocomplete="off">

            </div>

        </section>



        <!-- ========================================== -->
        <!-- DEVELOPER PROFILE                          -->
        <!-- ========================================== -->

        <section class="profile-section">

            <h2>
                Developer Profile
            </h2>


            <div id="dev-profile-card">

                <!--
                    Profile information will
                    appear here dynamically.
                -->

            </div>

        </section>



        <!-- ========================================== -->
        <!-- DAY 27: REPOSITORY FEED                    -->
        <!-- ========================================== -->

        <section class="repositories-section">

            <h2>
                Recent Repositories
            </h2>


            <div
                id="repos-grid"
                class="initiatives-grid">

                <!--
                    Repository cards will be
                    rendered dynamically.
                -->

            </div>

        </section>


    </main>


    <script src="script.js"></script>

</body>

</html>
